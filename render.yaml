services:
  - type: web
    name: vidbot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - {key: API_ID, sync: false}
      - {key: API_HASH, sync: false}
      - {key: BOT_TOKEN, sync: false}
      - {key: MONGO_URL, sync: false}
      - {key: OWNER_IDS, sync: false}
      - {key: FORCE_CHANNEL, sync: false}
      - {key: LOG_GROUP, sync: false}
      - {key: ADMIN_PASSWORD, sync: false}
      - {key: SECRET_KEY, generateValue: true}
